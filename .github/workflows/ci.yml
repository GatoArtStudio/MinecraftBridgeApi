name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, develop, feature/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify with Maven
        run: mvn -B verify --file pom.xml
